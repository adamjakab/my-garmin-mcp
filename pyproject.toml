[project]
name = "my-garmin-mcp"
version = "0.3.1"
description = "Personal MCP server exposing Garmin data to Claude"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "mcp~=2.3",
    "uvicorn>=0.30",
    "python-dotenv>=1.0",
    "garminconnect>=0.3.17",
]

[project.scripts]
my-garmin-mcp = "my_garmin_mcp.__main__:main"
rotate-key = "my_garmin_mcp.auth.rotate:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/my_garmin_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
